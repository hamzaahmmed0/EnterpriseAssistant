[project]
name = "enterprise-assistant-backend"
version = "0.1.0"
description = "Access-controlled document Q&A and contract compliance review -- backend"
requires-python = ">=3.11"

# Dependencies are declared in requirements.txt / requirements-dev.txt, which is the single
# source of truth for this project. This table stays empty deliberately; maintaining both would
# guarantee they drift.
dependencies = []

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D"]
ignore = [
    "D203",    # incompatible with D211, which we keep
    "D213",    # incompatible with D212, which we keep
    "B008",    # Depends(...) in a default is the FastAPI idiom
    "ANN401",  # a few boundaries genuinely take Any (JSON payloads, Qdrant filters)
    "UP042",   # Verdict subclasses (str, Enum) for pydantic/SQLAlchemy compatibility
]

[tool.ruff.lint.per-file-ignores]
# Tests are documentation of behaviour: docstrings yes, type annotations on fixtures no.
"tests/*" = ["ANN001", "ANN201", "ANN202", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
