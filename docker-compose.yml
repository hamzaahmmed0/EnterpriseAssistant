# Local + single-VM deployment topology.
#
# Bring up infrastructure first, ingest, then the app:
#   docker compose up -d qdrant postgres ollama
#   docker compose run --rm backend python -m app.ingestion.pipeline --manifest /data/corpus/manifest.json
#   docker compose up -d backend frontend

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333" # HTTP / dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eka}
      POSTGRES_USER: ${POSTGRES_USER:-eka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eka}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eka} -d ${POSTGRES_DB:-eka}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Serves both the LLM and the embedding model (ADR-005), so there is one model runtime to run.
  # On a GPU host, comment this out and point OLLAMA_BASE_URL at the host install instead --
  # in-container Ollama is CPU-only here, which is the difference between seconds and minutes
  # per query.
  ollama:
    image: ollama/ollama:0.5.7
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # Pulls the two models once, then exits. Without this, the first request downloads ~5 GB while
  # a user waits, and the eval latency numbers for that run are meaningless.
  ollama-pull:
    image: ollama/ollama:0.5.7
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull ${LLM_MODEL:-qwen2.5:7b-instruct} &&
       ollama pull ${EMBEDDING_MODEL:-nomic-embed-text}"
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override the localhost defaults in .env with in-network service names.
      QDRANT_HOST: qdrant
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eka}:${POSTGRES_PASSWORD:-eka}@postgres:5432/${POSTGRES_DB:-eka}
      DEMO_USERS_PATH: /app/demo_users.json
      INGEST_SOURCE_DIR: /data/corpus
      INGEST_MANIFEST_PATH: /data/corpus/manifest.json
      CONTRACT_UPLOAD_DIR: /data/contracts
      JUDGE_CACHE_PATH: /data/.judge_cache.json
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      # The corpus stays on the host: it is never committed and never baked into an image.
      - ./data:/data
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "3000:3000"
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Enterprise Knowledge Assistant}
      AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-480}
    depends_on:
      - backend
    restart: unless-stopped

  # The MCP server runs as a stdio process launched by the client, so it is not a service here.
  # For MCP_TRANSPORT=http, run:
  #   docker compose run --rm -p 8001:8001 -e MCP_TRANSPORT=http backend python -m app.mcp.server

volumes:
  qdrant_storage:
  pgdata:
  ollama_models:
